<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gabimaru Chess 2D</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f; 
            --panel: #151522; 
            --text: #ffffff; 
            --muted: #8b8b9f;
            --light-sq: #e8e3d9; 
            --dark-sq: #4a3e51; 
            --highlight: #a855f7; 
            --red: #ff2858;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100dvh; overflow: hidden; position: relative;
        }

        /* شاشة القائمة */
        #menu { text-align: center; width: 90%; max-width: 400px; animation: fadeIn 0.4s; }
        .logo { font-size: 36px; font-weight: 900; margin-bottom: 5px; background: linear-gradient(90deg, #ff2858, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--muted); font-size: 15px; margin-bottom: 30px; }
        .btn-menu {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; margin-bottom: 12px; padding: 18px 20px; border-radius: 12px;
            background: var(--panel); border: 1px solid #2a2a3d; color: white; font-size: 18px; font-weight: 700;
            cursor: pointer; transition: 0.2s;
        }
        .btn-menu:active { transform: scale(0.97); border-color: var(--highlight); }
        .btn-menu span { font-size: 24px; }

        /* شاشة اللعب */
        #game { display: none; width: 100%; height: 100dvh; flex-direction: column; animation: fadeIn 0.4s; }
        
        /* الشريط العلوي */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: var(--panel); border-bottom: 2px solid #2a2a3d;
        }
        .player-info { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .player-info.ai { flex-direction: row-reverse; }
        .avatar { width: 40px; height: 40px; background: #2a2a3d; border-radius: 8px; display: grid; place-items: center; font-size: 20px; }
        .player-info.ai .avatar { background: #3a1e3a; color: var(--red); }
        .vs { font-weight: 900; color: var(--muted); font-size: 14px; }

        /* اللوحة */
        .board-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .board { 
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
            width: 100%; max-width: 500px; aspect-ratio: 1; 
            border: 3px solid var(--highlight); border-radius: 4px;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
        }
        .square {
            display: flex; justify-content: center; align-items: center; position: relative;
            width: 100%; height: 100%; cursor: pointer;
        }
        .light { background: var(--light-sq); }
        .dark { background: var(--dark-sq); }
        .square img { width: 90%; height: 90%; object-fit: contain; pointer-events: none; user-select: none; }
        
        .square.selected { box-shadow: inset 0 0 0 4px var(--red); }
        .square.valid-move::after { content: ''; position: absolute; width: 30%; height: 30%; background: rgba(168, 85, 247, 0.6); border-radius: 50%; box-shadow: 0 0 10px var(--highlight); }
        .square.capture::after { content: ''; position: absolute; inset: 5%; border: 4px solid var(--red); border-radius: 50%; background: transparent; }

        /* شريط التحكم السفلي */
        .bottom-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: var(--panel); border-top: 2px solid #2a2a3d;
        }
        .btn-icon {
            background: #2a2a3d; border: none; border-radius: 8px; color: white; font-size: 20px;
            width: 45px; height: 45px; display: grid; place-items: center; cursor: pointer;
        }
        .btn-icon:active { background: var(--red); }
        
        .status-text { font-size: 14px; font-weight: bold; color: var(--muted); display: flex; align-items: center; gap: 8px; }
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--highlight); border-radius: 50%; animation: spin 1s linear infinite; display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
        .square.threatened::before { 
            content: ''; position: absolute; inset: 0; 
            background: rgba(255, 40, 88, 0.4); 
            box-shadow: inset 0 0 10px rgba(255, 40, 88, 0.8);
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
    <!-- القائمة الرئيسية -->
    <div id="menu">
        <div class="logo">Gabimaru Chess</div>
        <div class="subtitle">اختر مستوى الذكاء الاصطناعي</div>
        <button class="btn-menu" onclick="startGame(1)"><span>🤖</span> سهل</button>
        <button class="btn-menu" onclick="startGame(2)"><span>⚔️</span> متوسط</button>
        <button class="btn-menu" onclick="startGame(3)"><span>🔥</span> صعب</button>
        <button class="btn-menu" onclick="startGame(4)" style="border-color: var(--red);"><span>💀</span> جحيمي</button>
    </div>

    <!-- واجهة اللعب -->
    <div id="game">
        <!-- الشريط العلوي -->
        <div class="top-bar">
            <div class="player-info">
                <div class="avatar">👤</div>
                <div>أنت</div>
            </div>
            <div class="vs">VS</div>
            <div class="player-info ai">
                <div class="avatar">🤖</div>
                <div id="aiName">AI</div>
            </div>
        </div>

        <!-- منطقة اللوحة -->
        <div class="board-area">
            <div class="board" id="board"></div>
        </div>

        <!-- الشريط السفلي -->
        <div class="bottom-bar">
            <button class="btn-icon" onclick="location.reload()">🏠</button>
            <div class="status-text">
                <div class="spinner" id="spinner"></div>
                <span id="statusText">جاري التحميل...</span>
            </div>
            <button class="btn-icon" onclick="location.reload()">🔄</button>
        </div>
    </div>

    <script>
        const pieceImages = {
            'wp': 'https://lichess1.org/assets/piece/cburnett/wP.svg', 'wn': 'https://lichess1.org/assets/piece/cburnett/wN.svg',
            'wb': 'https://lichess1.org/assets/piece/cburnett/wB.svg', 'wr': 'https://lichess1.org/assets/piece/cburnett/wR.svg',
            'wq': 'https://lichess1.org/assets/piece/cburnett/wQ.svg', 'wk': 'https://lichess1.org/assets/piece/cburnett/wK.svg',
            'bp': 'https://lichess1.org/assets/piece/cburnett/bP.svg', 'bn': 'https://lichess1.org/assets/piece/cburnett/bN.svg',
            'bb': 'https://lichess1.org/assets/piece/cburnett/bB.svg', 'br': 'https://lichess1.org/assets/piece/cburnett/bR.svg',
            'bq': 'https://lichess1.org/assets/piece/cburnett/bQ.svg', 'bk': 'https://lichess1.org/assets/piece/cburnett/bK.svg'
        };
        const symbolToKey = {
            '♙':'wp','♘':'wn','♗':'wb','♖':'wr','♕':'wq','♔':'wk',
            '♟':'bp','♞':'bn','♝':'bb','♜':'br','♛':'bq','♚':'bk'
        };

        let gameId = null, currentLevel = 1, selectedSquare = null, currentBoard = [], legalMoves = [], isAiTurn = false, threatenedSquares = [];
        const files = ['a','b','c','d','e','f','g','h'], ranks = ['8','7','6','5','4','3','2','1'];
        const levelNames = {1: 'سهل', 2: 'متوسط', 3: 'صعب', 4: 'جحيمي'};

        async function startGame(level) {
            currentLevel = level;
            document.getElementById('aiName').innerText = 'AI (' + levelNames[level] + ')';
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game').style.display = 'flex';
            setStatus('جاري بدء المباراة...', true);

            try {
                const res = await fetch('/api/chess/new', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ level: level })
                });
                const data = await res.json();
                if(data.ok) { gameId = data.state.id; updateBoard(data.state); }
                else setStatus('حدث خطأ');
            } catch (e) { setStatus('تعذر الاتصال'); }
        }

        function setStatus(text, loading = false) {
            document.getElementById('statusText').innerText = text;
            document.getElementById('spinner').style.display = loading ? 'block' : 'none';
        }

        function updateBoard(state) {
            currentBoard = state.board;
            legalMoves = state.legal || [];
            isAiTurn = (state.turn === 'b');
            
            // --- كود اكتشاف التهديدات (تصحيح) ---
            threatenedSquares = [];
            try {
                let fen = state.fen;
                let parts = fen.split(' ');
                // نقلب الدور عشان نشوف تهديدات الخصم
                parts[1] = (parts[1] === 'w') ? 'b' : 'w';
                let flippedFen = parts.join(' ');
                
                const tempChess = new Chess(flippedFen);
                const opponentMoves = tempChess.moves({ verbose: true });
                for (const move of opponentMoves) {
                    if (move.captured) {
                        threatenedSquares.push(move.to); 
                    }
                }
            } catch (e) { console.log('Threat detection error', e); }
            // -------------------------

            if (state.over) setStatus(state.status);
            else if (isAiTurn) setStatus('الذكاء الاصطناعي يفكر...', true);
            else setStatus('دورك للعب', false);

            renderBoard();
            if (isAiTurn && !state.over) setTimeout(makeAiMove, 500);
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.createElement('div');
                    sq.className = 'square ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
                    const pos = files[c] + ranks[r];
                    
                    const piece = currentBoard[r][c];
                    if (piece) {
                        const key = symbolToKey[piece];
                        if (key) {
                            const img = document.createElement('img');
                            img.src = pieceImages[key];
                            sq.appendChild(img);
                        }
                    }

                    if (selectedSquare === pos) sq.classList.add('selected');
                    if (threatenedSquares.includes(pos)) sq.classList.add('threatened');
                    if (selectedSquare) {
                        const move = legalMoves.find(m => m.from === selectedSquare && m.to === pos);
                        if (move) sq.classList.add(move.captured ? 'capture' : 'valid-move');
                    }
                    sq.onclick = () => handleSquareClick(pos);
                    boardEl.appendChild(sq);
                }
            }
        }

        function handleSquareClick(pos) {
            if (isAiTurn) return;
            if (selectedSquare) {
                const move = legalMoves.find(m => m.from === selectedSquare && m.to === pos);
                if (move) makeMove(selectedSquare, pos);
                else { selectedSquare = null; renderBoard(); }
            } else {
                if (legalMoves.some(m => m.from === pos)) {
                    selectedSquare = pos;
                    renderBoard();
                }
            }
        }

        async function makeMove(from, to) {
            selectedSquare = null;
            setStatus('جاري التنفيذ...', true);
            try {
                const res = await fetch('/api/chess/move', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ id: gameId, from, to, promotion: 'q' })
                });
                const data = await res.json();
                if(data.ok) updateBoard(data.state);
                else { setStatus('حركة غير صالحة'); renderBoard(); }
            } catch (e) { setStatus('خطأ في الاتصال'); }
        }

        async function makeAiMove() {
            try {
                const res = await fetch('/api/chess/ai-move', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ id: gameId, level: currentLevel })
                });
                const data = await res.json();
                if(data.ok) updateBoard(data.state);
                else setStatus('خطأ في البوت');
            } catch (e) { setStatus('تأخير في السيرفر'); }
        }
    </script>
</body>
</html>
