<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج جابيمارو VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07070d; --panel: #11111d; --line: #30233d;
            --red: #ff2858; --purple: #a855f7; --text: #ffffff; --muted: #aaa9c2;
            --light-sq: #ebd8b7; --dark-sq: #b58863; --highlight: #a855f7;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body {
            margin: 0; background: radial-gradient(ellipse at 8% 0%, #54152c55, transparent 38%), radial-gradient(ellipse at 95% 20%, #4b168055, transparent 34%), var(--bg);
            color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden;
        }
        .container { width: 100%; max-width: 450px; padding: 15px; }
        
        /* شاشة القائمة */
        #menu { text-align: center; animation: fadeIn 0.5s; }
        .logo { font-size: 32px; font-weight: 900; margin-bottom: 5px; background: linear-gradient(90deg, #ff2858, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px #a855f755; }
        .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 30px; }
        .btn-menu {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; margin-bottom: 15px; padding: 18px 20px; border-radius: 15px;
            background: linear-gradient(120deg, #191522, #101019 75%);
            border: 1px solid var(--line); color: white; font-size: 18px; font-weight: 700;
            cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn-menu:active { transform: scale(0.96); border-color: var(--red); }
        .btn-menu span { font-size: 24px; }

        /* شاشة اللعب */
        #game { display: none; animation: fadeIn 0.5s; }
        .status-bar {
            background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 12px; text-align: center; margin-bottom: 15px; font-weight: bold;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .spinner {
            width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.2);
            border-top-color: var(--purple); border-radius: 50%; animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .board-wrapper {
            background: var(--panel); padding: 8px; border-radius: 12px;
            border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .board { display: grid; grid-template-columns: repeat(8, 1fr); border-radius: 8px; overflow: hidden; aspect-ratio: 1; }
        .square {
            display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .light { background: var(--light-sq); }
        .dark { background: var(--dark-sq); }
        .square img { width: 85%; height: 85%; pointer-events: none; user-select: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
        
        .square.selected { box-shadow: inset 0 0 0 4px var(--purple); }
        .square.valid-move::after { content: ''; position: absolute; width: 30%; height: 30%; background: rgba(168, 85, 247, 0.6); border-radius: 50%; box-shadow: 0 0 10px var(--purple); }
        .square.capture::after { content: ''; position: absolute; inset: 5%; border: 4px solid var(--red); border-radius: 50%; box-shadow: 0 0 10px var(--red); background: transparent; }

        .controls { margin-top: 15px; }
        .btn-reset { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(110deg, #ed174b, #a21caf); color: white; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 5px 15px rgba(237, 23, 75, 0.3); }
        .btn-reset:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <!-- القائمة الرئيسية -->
        <div id="menu">
            <div class="logo">♟️ شطرنج جابيمارو</div>
            <div class="subtitle">اختر مستوى الذكاء الاصطناعي</div>
            
            <button class="btn-menu" onclick="startGame(1)">
                <span>🤖</span> سهل (للمبتدئين)
            </button>
            <button class="btn-menu" onclick="startGame(2)">
                <span>⚔️</span> متوسط (تحدي)
            </button>
            <button class="btn-menu" onclick="startGame(3)">
                <span>🔥</span> صعب (احترافي)
            </button>
            <button class="btn-menu" onclick="startGame(4)" style="border-color: var(--red);">
                <span>💀</span> جحيمي (لا ترحم)
            </button>
        </div>

        <!-- لوحة اللعب -->
        <div id="game">
            <div class="status-bar">
                <div class="spinner" id="spinner"></div>
                <span id="statusText">جاري تحضير اللوحة...</span>
            </div>
            <div class="board-wrapper">
                <div class="board" id="board"></div>
            </div>
            <div class="controls">
                <button class="btn-reset" onclick="location.reload()">🔄 العودة للقائمة</button>
            </div>
        </div>
    </div>

    <script>
        // استخدام صور قطع الشطرنج الاحترافية (SVG)
        const pieceImages = {
            'wp': 'https://lichess1.org/assets/piece/cburnett/wP.svg',
            'wn': 'https://lichess1.org/assets/piece/cburnett/wN.svg',
            'wb': 'https://lichess1.org/assets/piece/cburnett/wB.svg',
            'wr': 'https://lichess1.org/assets/piece/cburnett/wR.svg',
            'wq': 'https://lichess1.org/assets/piece/cburnett/wQ.svg',
            'wk': 'https://lichess1.org/assets/piece/cburnett/wK.svg',
            'bp': 'https://lichess1.org/assets/piece/cburnett/bP.svg',
            'bn': 'https://lichess1.org/assets/piece/cburnett/bN.svg',
            'bb': 'https://lichess1.org/assets/piece/cburnett/bB.svg',
            'br': 'https://lichess1.org/assets/piece/cburnett/bR.svg',
            'bq': 'https://lichess1.org/assets/piece/cburnett/bQ.svg',
            'bk': 'https://lichess1.org/assets/piece/cburnett/bK.svg'
        };
        // ملاحظة: الخادم يرجع رموز، سنقوم بتحويلها إلى مفاتيح الصور
        const symbolToKey = {
            '♙':'wp','♘':'wn','♗':'wb','♖':'wr','♕':'wq','♔':'wk',
            '♟':'bp','♞':'bn','♝':'bb','♜':'br','♛':'bq','♚':'bk'
        };

        let gameId = null, currentLevel = 1, selectedSquare = null, currentBoard = [], legalMoves = [], isAiTurn = false;
        const files = ['a','b','c','d','e','f','g','h'], ranks = ['8','7','6','5','4','3','2','1'];

        async function startGame(level) {
            currentLevel = level;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            setStatus('جاري بدء المباراة...', true);

            try {
                const res = await fetch('/api/chess/new', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ level: level })
                });
                const data = await res.json();
                if(data.ok) { gameId = data.state.id; updateBoard(data.state); }
                else setStatus('حدث خطأ أثناء بدء اللعبة');
            } catch (e) { setStatus('تعذر الاتصال بالسيرفر'); }
        }

        function setStatus(text, loading = false) {
            document.getElementById('statusText').innerText = text;
            document.getElementById('spinner').style.display = loading ? 'block' : 'none';
        }

        function updateBoard(state) {
            currentBoard = state.board;
            legalMoves = state.legal || [];
            isAiTurn = (state.turn === 'b');
            
            if (state.over) setStatus(state.status);
            else if (isAiTurn) setStatus('🤖 الذكاء الاصطناعي يفكر...', true);
            else setStatus(state.status);

            renderBoard();
            if (isAiTurn && !state.over) setTimeout(makeAiMove, 600);
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.createElement('div');
                    sq.className = 'square ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
                    const pos = files[c] + ranks[r];
                    sq.dataset.pos = pos;

                    const piece = currentBoard[r][c];
                    if (piece) {
                        const key = symbolToKey[piece];
                        if (key) {
                            const img = document.createElement('img');
                            img.src = pieceImages[key];
                            sq.appendChild(img);
                        }
                    }

                    if (selectedSquare === pos) sq.classList.add('selected');
                    
                    if (selectedSquare) {
                        const move = legalMoves.find(m => m.from === selectedSquare && m.to === pos);
                        if (move) sq.classList.add(move.captured ? 'capture' : 'valid-move');
                    }

                    sq.onclick = () => handleSquareClick(pos);
                    boardEl.appendChild(sq);
                }
            }
        }

        function handleSquareClick(pos) {
            if (isAiTurn) return;
            if (selectedSquare) {
                const move = legalMoves.find(m => m.from === selectedSquare && m.to === pos);
                if (move) makeMove(selectedSquare, pos);
                else { selectedSquare = null; renderBoard(); }
            } else {
                if (legalMoves.some(m => m.from === pos)) {
                    selectedSquare = pos;
                    renderBoard();
                }
            }
        }

        async function makeMove(from, to) {
            selectedSquare = null;
            setStatus('جاري تنفيذ الحركة...', true);
            try {
                const res = await fetch('/api/chess/move', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ id: gameId, from, to, promotion: 'q' })
                });
                const data = await res.json();
                if(data.ok) updateBoard(data.state);
                else { setStatus('حركة غير صالحة'); renderBoard(); }
            } catch (e) { setStatus('خطأ في الاتصال'); }
        }

        async function makeAiMove() {
            try {
                const res = await fetch('/api/chess/ai-move', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ id: gameId, level: currentLevel })
                });
                const data = await res.json();
                if(data.ok) updateBoard(data.state);
                else setStatus('خطأ في حركة البوت');
            } catch (e) { setStatus('السيرفر يستغرق وقتاً طويلاً للرد'); }
        }
    </script>
</body>
</html>
